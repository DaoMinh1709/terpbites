<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TerpBites</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">TerpBites <span>What's in the dining hall right now</span></div>
    <nav id="halls" class="halls" role="tablist"></nav>
  </header>

  <main>
    <section class="now">
      <div id="now-text" class="now-text">Loading…</div>
      <div id="meals" class="meals"></div>
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="Search this menu…">
        <select id="sort" class="sort" aria-label="Sort by">
          <option value="station">Sort: By station</option>
          <option value="station-az">Sort: Station A–Z</option>
          <option value="rating-desc">Sort: Rating high → low</option>
          <option value="rating-asc">Sort: Rating low → high</option>
        </select>
      </div>
    </section>
    <div id="menu" class="menu"></div>
  </main>

  <dialog id="food">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <div id="food-body"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
